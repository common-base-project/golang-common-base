version: "3.9"

services:
  backend-admin:
    build:
      context: ../backend-admin
      dockerfile: Dockerfile
    environment:
      ENV_SERVER_MODE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: db_common_base
    ports:
      - "9080:9080"
    depends_on:
      - mysql
      - redis
      - minio
      - casdoor

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: db_common_base
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  casdoor:
    image: casbin/casdoor-all-in-one:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      driverName: mysql
      dataSourceName: root:123456@tcp(mysql:3306)/casdoor?charset=utf8mb4&parseTime=True&loc=Local
      runmode: dev
    depends_on:
      - mysql

volumes:
  mysql_data:
  redis_data:
  minio_data:
