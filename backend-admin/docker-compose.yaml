version: '3.3'
services:
  common-db:
    image: 'mysql:latest'
    restart: always
    container_name: common-db
    ports:
      - 3306:3306
    expose:
      - 3306
#    volumes:
#      - './data/mysql:/var/lib/mysql'
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: common-user
      MYSQL_PASSWORD: common_123456
      MYSQL_DATABASE: db_common_base

  golang-common-base:
    image: 'harbor.5qipa.com:6443/common/golang-common-base:staging_v0.0.2'
    container_name: golang-common-base
    tty: true
    restart: always
    ports:
      - 9080:9080
    links:
      - common-db
    depends_on:
      - common-db
    environment:
      MYSQL_HOST: common-db
      MYSQL_PORT: 3306
      MYSQL_USER: common-user
      MYSQL_PASSWORD: common_123456
      MYSQL_DATABASE: db_common_base


networks:
  common-tools:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.1.25.1/16
